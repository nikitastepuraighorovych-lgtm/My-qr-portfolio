<!DOCTYPE html>
<html>
<head>
  <title>NikitaStepura</title>
  <style>
    :root { background-color: #000 !important; }
    body { background-color: #000; margin: 0; }
    #console {
      font-family: courier, monospace;
      color: #fff;
      width: 750px;
      margin-left: auto;
      margin-right: auto;
      margin-top: 100px;
      font-size: 14px;
      line-height: 1.6;
    }
    a { color: #0bc; text-decoration: none; }
    #a { color: #0f0; }
    #b { color: #ff0096; }
    #c { color: #0bc; }
    #k { animation: 1s change infinite; }
    #cursor {
      display: inline-block;
      color: #fff;
      animation: blink 0.5s step-end infinite;
    }
    #op { color: #888; }
    @keyframes change {
      0%, 50% { color: #0f0; }
      99%      { color: #000; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>
<div id="console"><span id="cursor">|</span></div>

<script>
var Typer = {
  file: '\n<span id="a">Nsi@nsI</span>:<span id="b">~</span><span id="c">$</span> cd NikitaStepura/About_Me\n'
      + '<span id="a">Nsi@nsI</span>:<span id="b">~</span><span id="c">$</span> cat NikitaStepura.txt<br/><br/>\n'
      + 'Hello! I am <span id="k">DevOps and SOC security specialist</span>.\n\n'
      + '<p>I am a DevOps &amp; SOC Analyst with hands-on experience in CI/CD, cloud infrastructure, '
      + 'system automation, and security operations.</p>\n'
      + '<p>I combine strong technical skills in Python, Bash, and infrastructure-as-code with a '
      + 'background in cybersecurity and SOC analysis, providing a unique perspective on building '
      + 'secure, scalable, and observable systems.</p>\n'
      + '<p>My profiles:<br>'
      + '<a href="https://www.linkedin.com/in/nikita-stepura-2b3314376/">LinkedIn</a><br>'
      + '<a href="https://github.com/nikitastepuraighorovych-lgtm">GitHub</a>.</p>\n\n'
      + '<p>Cheers!</p>\n',

  text:  '',
  index: 0,
  speed: 3,

  init: function () {
    Typer.text = Typer.file;

    Typer.accessCountimer = setInterval(function () {
      Typer.updLstChr();
    }, 500);
  },

  accessCount:  0,
  deniedCount:  0,
  accessCountimer: null,

  makeAccess: function () { console.log('access granted'); },
  makeDenied: function () { console.log('access denied');  },
  hidepop:    function () { console.log('pop hidden');     },

  content: function () {
    return document.getElementById('console').innerHTML;
  },

  advanceIndex: function () {
    var raw = Typer.text;
    var pos = Typer.index;
    var steps = Typer.speed;

    while (steps > 0 && pos < raw.length) {
      if (raw[pos] === '<') {
        while (pos < raw.length && raw[pos] !== '>') { pos++; }
        pos++; 
      } else {
        pos++;
      }
      steps--;
    }
    Typer.index = pos;
  },

  addText: function (e) {
    var kc = e.keyCode;

    if      (kc === 18) { Typer.accessCount++; if (Typer.accessCount >= 3) Typer.makeAccess(); return; }
    else if (kc === 20) { Typer.deniedCount++;  if (Typer.deniedCount  >= 3) Typer.makeDenied();  return; }
    else if (kc === 27) { Typer.hidepop(); return; }
    else if (kc === 8)  { if (Typer.index > 0) Typer.index = Math.max(0, Typer.index - Typer.speed); }
    else                { Typer.advanceIndex(); }

    var slice = Typer.text.substring(0, Typer.index)
                           .replace(/\n/g, '<br/>');
    document.getElementById('console').innerHTML =
      slice + '<span id="cursor">|</span>';
  }
};

Typer.init();

var timer = setInterval(function () {
  Typer.addText({ keyCode: 999 });
  if (Typer.index >= Typer.text.length) clearInterval(timer);
}, 30);

document.onkeydown = function (e) {
  if (e.keyCode === 27) Typer.index = Typer.text.length;
};
</script>
</body>
</html>
